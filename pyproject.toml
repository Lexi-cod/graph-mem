[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphmem"
version = "0.1.0"
description = "Temporal knowledge-graph memory for LLM agents"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "neo4j>=5.26",
  "sentence-transformers>=3.0",
  "numpy",
  "httpx>=0.27",
  "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
bench = ["faiss-cpu>=1.8", "mem0ai>=2.2", "spacy>=3.8", "fastembed>=0.9"]
api = ["langgraph>=1.0", "fastapi>=0.115", "uvicorn[standard]>=0.30"]

[tool.hatch.build.targets.wheel]
packages = ["src/graphmem"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires a running Neo4j (docker compose up -d)"]
